name: Bug report
description: Report a reproducible problem with HandsFree.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use invented or redacted examples. Never include API keys, private page contents, or sensitive browsing information."
  - type: input
    id: version
    attributes:
      label: HandsFree and Chrome versions
      placeholder: "HandsFree 1.7.0, Chrome …"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "macOS / Windows / Linux and version"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a redacted spoken or typed command and whether AI was enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include what the progress list confirmed before the problem.
    validations:
      required: true
