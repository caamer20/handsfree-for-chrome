name: Feature request
description: Suggest a focused improvement to voice-controlled browsing.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to accomplish?
      description: Describe the task and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Include an example command or workflow if useful.
    validations:
      required: true
