name: Build and test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package
      - run: npm run models:download
      - run: npm run check:local-ai
      - run: npm run package:local-ai
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npm run test:browser -- --headed
      - name: Verify upgrades from published 1.8 and 1.7 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.0 --repo caamer20/handsfree-for-chrome --pattern handsfree-for-chrome.zip --dir previous/1.8.0
          echo '69813a8cca526bf94da2a847a30ecdf6f554ac794a2294fedaf552c04d46e4e1  previous/1.8.0/handsfree-for-chrome.zip' | sha256sum --check
          test "$(wc -c < previous/1.8.0/handsfree-for-chrome.zip)" -eq 182986
          result=0
          HANDSFREE_UPGRADE_VERSION=1.8.0 HANDSFREE_UPGRADE_ZIP=previous/1.8.0/handsfree-for-chrome.zip npm run test:upgrade || result=1
          gh release download v1.7.0-preview.1 --repo caamer20/handsfree-for-chrome --pattern handsfree-for-chrome.zip --dir previous/1.7.0
          echo '843275f4e6dc897cb1efccb436568246cb453f3c2d0bf0faeb5b531712b2c239  previous/1.7.0/handsfree-for-chrome.zip' | sha256sum --check
          HANDSFREE_UPGRADE_VERSION=1.7.0 HANDSFREE_UPGRADE_ZIP=previous/1.7.0/handsfree-for-chrome.zip npm run test:upgrade || result=1
          exit "$result"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: handsfree-for-chrome
          path: release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-validation-linux
          path: |
            test-results/
            test-results-upgrade/
          retention-days: 14
  browser-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-validation-${{ matrix.os }}
          path: test-results/
          retention-days: 14
