name: Build and test
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run models:download
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: handsfree-for-chrome
          path: release/
          if-no-files-found: error
          retention-days: 30
